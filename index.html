<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Life House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1d2b;--panel:#24273a;--line:#3a3e58;--ink:#f3eadc;--muted:#a9a5c6;--acc:#ffcf6b;--acc-ink:#3a2a10}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#74ad58}
body{color:var(--ink);font-family:'Pixelify Sans',system-ui,sans-serif}
.wrap{position:fixed;top:16px;left:16px;right:16px;z-index:1;pointer-events:none}
.wrap>div{display:inline-block;background:rgba(27,29,43,.82);border:2px solid #11131d;padding:8px 12px;max-width:100%}
.stage{position:fixed;inset:0}
.menu-btn{position:fixed;z-index:3;left:max(16px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);width:44px;height:44px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;background:rgba(27,29,43,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:2px solid rgba(255,255,255,.18);box-shadow:0 4px 0 rgba(17,19,29,.6);cursor:pointer;padding:0}
.menu-btn span{display:block;width:20px;height:3px;background:var(--ink)}
.menu-btn:hover{border-color:var(--acc)}
.menu-btn:focus-visible,.drawer button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.menu-btn[aria-expanded="true"]{opacity:0;pointer-events:none}
.drawer{position:fixed;z-index:4;top:0;bottom:0;left:0;width:300px;max-width:85vw;background:rgba(27,29,43,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-right:2px solid rgba(255,255,255,.18);color:var(--ink);padding:16px max(16px,env(safe-area-inset-left,0px));padding-right:16px;box-sizing:border-box;overflow-y:auto;transform:translateX(-105%);transition:transform .22s ease-out;font-family:'Pixelify Sans',system-ui,sans-serif}
.drawer.open{transform:none}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.drawer h2{margin:0;font-size:20px;font-weight:600}
.drawer h3{margin:0 0 10px;font-size:13px;font-weight:400;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.drawer .x{font:inherit;font-size:18px;background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 6px}
.grp{margin-bottom:14px}
.grp .gh{font:inherit;font-size:16px;color:var(--ink);background:none;border:0;padding:0;margin:0 0 6px;display:flex;align-items:center;gap:8px;cursor:pointer;width:100%;text-align:left}
.grp .gh:hover .gn{color:var(--acc)}
.grp .dot{width:8px;height:8px;background:#5a5f80;box-shadow:0 0 0 2px rgba(17,19,29,.7);flex:none}
.grp .dot.lit{background:var(--acc)}
.grp .cnt{margin-left:auto;font-size:12px;color:var(--muted)}
.grp ul{list-style:none;margin:0;padding:0 0 0 16px;display:flex;flex-direction:column;gap:5px}
.grp li{font-size:14px;line-height:1.3;color:#e2dacd}
.grp ul{padding-left:4px}
.tl{display:flex;gap:8px;align-items:flex-start;background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%;line-height:1.3}
.tl .bx{flex:none;width:12px;height:12px;margin-top:2px;border:2px solid var(--acc);box-sizing:border-box;display:flex;align-items:center;justify-content:center}
.tl:hover .bx{background:rgba(255,207,107,.25)}
.tl.done{color:var(--muted);text-decoration:line-through;cursor:default}
.tl.done .bx{background:var(--acc)}
.tl:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.chest-wrap{position:fixed;inset:0;z-index:6;display:none;align-items:center;justify-content:center;background:rgba(10,12,20,.38);padding:16px}
.chest-wrap.show{display:flex}
.chest-card{width:300px;max-width:100%;background:rgba(27,29,43,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:2px solid rgba(255,255,255,.18);box-shadow:0 5px 0 rgba(17,19,29,.6);padding:16px;color:var(--ink);text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;font-family:'Pixelify Sans',system-ui,sans-serif;animation:pop .2s ease-out}
.chest-card .ct{font-size:18px;font-weight:600}
.chest-card .cs{font-size:13px;color:var(--muted);margin-top:-6px}
#chc{width:192px;height:160px;image-rendering:pixelated}
#chc.shake{animation:shake .5s steps(2) infinite}
@keyframes shake{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-3px,0) rotate(-2deg)}50%{transform:translate(3px,-2px) rotate(2deg)}75%{transform:translate(-2px,0) rotate(-1deg)}}
.cres{font-size:15px;min-height:20px;line-height:1.4}
.rb{display:inline-block;font-size:12px;padding:1px 6px;margin-right:6px;border:2px solid;vertical-align:1px}
.rb.c{color:#a8e4ff;border-color:#a8e4ff}.rb.r{color:#c59bff;border-color:#c59bff}.rb.e{color:#3a2a10;background:#ffd35c;border-color:#ffd35c}
.cbtn{font:inherit;font-size:16px;padding:9px 18px;border:2px solid #11131d;background:var(--acc);color:#3a2a10;cursor:pointer;box-shadow:0 4px 0 #a07a2a}
.cbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #a07a2a}
.cbtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media (prefers-reduced-motion:reduce){#chc.shake{animation:none}}
.ob{position:fixed;inset:0;z-index:8;display:none;background:#1b1d2b;font-family:'Pixelify Sans',system-ui,sans-serif}
.ob.show{display:block}
.obc{position:absolute;inset:0;overflow-y:auto;box-sizing:border-box;background:#1b1d2b;color:var(--ink);display:flex;flex-direction:column;gap:clamp(14px,2.4vh,24px);padding:clamp(20px,5vh,56px) max(16px,env(safe-area-inset-right,0px)) clamp(20px,4vh,40px) max(16px,env(safe-area-inset-left,0px));padding-left:max(clamp(16px,5vw,64px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,5vw,64px),env(safe-area-inset-right,0px));animation:pop .2s ease-out}
.obc h2{margin:0;font-size:clamp(26px,4.2vw,44px);font-weight:600;line-height:1.1;text-wrap:balance}
.obc .lead{margin:-6px 0 0;color:var(--muted);font-size:clamp(15px,1.8vw,19px)}
.q{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
.q .ql{display:flex;justify-content:space-between;gap:8px}
.q .qh{color:var(--muted);font-size:15px}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));grid-auto-rows:minmax(64px,1fr);gap:clamp(8px,1.4vw,14px);flex:1}
.chip{font:inherit;font-size:clamp(17px,2vw,22px);color:var(--ink);background:#262a3d;border:3px solid #3a3e58;padding:12px 16px;cursor:pointer;box-shadow:0 5px 0 #11131d;text-align:center;display:flex;align-items:center;justify-content:center}
.chip:hover{border-color:var(--acc)}
.chip:active{transform:translateY(3px);box-shadow:0 2px 0 #11131d}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#3a2a10;box-shadow:0 5px 0 #a07a2a}
.chip:disabled{opacity:.35;cursor:not-allowed}
.chip:focus-visible,.obc button:focus-visible,.obc textarea:focus-visible{outline:3px solid #fff;outline-offset:3px}
.ivtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ivn{font-size:15px;color:var(--acc);letter-spacing:.5px}
.ivbox{position:relative;flex:1;min-height:180px;display:flex}
.ivload{position:absolute;inset:0;z-index:1;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#14161f;border:3px solid #3a3e58}
.ivload.show{display:flex}
.ivload canvas{width:min(288px,70%);height:auto;image-rendering:pixelated}
.ivlmsg{font-size:clamp(17px,2vw,21px);color:var(--ink);text-align:center;padding:0 16px}
.ivbox textarea{flex:1;min-width:0;font:inherit;font-size:clamp(18px,2vw,22px);line-height:1.45;resize:none;padding:18px 20px 64px;box-sizing:border-box;background:#14161f;color:var(--ink);border:3px solid #3a3e58}
.ivbox textarea:focus{border-color:var(--acc);outline:none}
.ivbox textarea:disabled{opacity:.6}
.mic{position:absolute;right:14px;bottom:14px;font:inherit;font-size:16px;display:flex;align-items:center;gap:8px;padding:10px 16px;background:#262a3d;color:var(--ink);border:3px solid #3a3e58;cursor:pointer;box-shadow:0 4px 0 #11131d}
.mic:hover{border-color:var(--acc)}
.mic .micdot{width:12px;height:12px;background:#ff6f6f;border-radius:50%}
.mic[aria-pressed="true"]{background:#ff6f6f;border-color:#ff6f6f;color:#2b1010}
.mic[aria-pressed="true"] .micdot{background:#fff;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.ivstat{color:var(--muted);font-size:15px}
.ivleft{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ivack{margin:0;font-size:clamp(15px,1.7vw,18px);color:var(--acc);min-height:1.2em}
.ivack:empty{display:none}
.sofar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:2px}
.sofar .sl{font-size:13px;color:var(--muted);margin-right:2px}
.sofar .sc{font-size:14px;padding:3px 9px;background:#2e3049;border:2px solid #5d6288}
.cbtn:disabled{opacity:.5;cursor:wait}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;flex:1;align-content:start}
.scard{font:inherit;text-align:left;color:var(--ink);cursor:pointer;background:#262a3d;border:3px solid var(--acc);box-shadow:0 5px 0 #a07a2a;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.scard[aria-pressed="false"]{border:3px dashed #3a3e58;box-shadow:none;opacity:.55}
.scard:focus-visible{outline:3px solid #fff;outline-offset:3px}
.scard .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.scard .nm{font-size:20px;font-weight:600}
.scard .tick{flex:none;width:22px;height:22px;border:3px solid var(--acc);background:var(--acc);color:#3a2a10;font-size:15px;display:flex;align-items:center;justify-content:center;line-height:1}
.scard[aria-pressed="false"] .tick{background:none;border-color:#5a5f80;color:transparent}
.scard .why{font-size:14px;color:var(--muted)}
.scard .tds{margin:0;padding-left:18px;font-size:15px;line-height:1.4;color:#e2dacd;display:flex;flex-direction:column;gap:4px}
.scard .td{display:list-item}
.goals{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.goals .gl{font-size:14px;color:var(--muted);margin-right:4px}
.goals span.g{font-size:15px;padding:5px 10px;background:#2e3049;border:2px solid #5d6288}
@media (prefers-reduced-motion:reduce){.mic[aria-pressed="true"] .micdot{animation:none}}
.obhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.obhead>div:first-child{display:flex;flex-direction:column;gap:12px;min-width:0}
.obcapy{flex:none;width:clamp(96px,14vw,170px)}
.obcapy svg,.obcapy canvas{width:100%;height:auto;display:block;image-rendering:pixelated}
.steps{display:flex;gap:8px}
.steps i{width:clamp(28px,5vw,48px);height:8px;background:#3a3e58}
.steps i.on{background:var(--acc)}
.chips.big{grid-template-columns:1fr;grid-auto-rows:minmax(72px,1fr)}
.chips.big .chip{font-size:clamp(19px,2.4vw,26px);justify-content:flex-start;text-align:left;padding:14px 22px}
.oberr{color:#ff9f8f;font-size:15px;min-height:18px;margin-top:-6px}
.obrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.obrow .cbtn{font-size:clamp(18px,2vw,22px);padding:14px 32px}
.oblink{font:inherit;font-size:16px;background:none;border:0;color:var(--muted);cursor:pointer;padding:6px 0;text-decoration:underline}
.chat{display:flex;flex-direction:column;gap:8px;flex:1;min-height:180px;overflow-y:auto;padding:12px;background:#14161f;border:3px solid #3a3e58}
.msg{max-width:85%;padding:7px 10px;font-size:14px;line-height:1.35;white-space:pre-wrap;word-wrap:break-word}
.msg.bot{align-self:flex-start;background:rgba(255,255,255,.1)}
.msg.me{align-self:flex-end;background:rgba(255,207,107,.9);color:#3a2a10}
.msg .add{display:block;margin-top:4px;color:var(--acc);font-size:13px}
.compose{display:flex;gap:8px;align-items:flex-end}
.compose textarea{flex:1;min-width:0;font:inherit;font-size:15px;resize:none;height:44px;padding:8px 10px;box-sizing:border-box;background:#1b1d2b;color:var(--ink);border:2px solid #3a3e58}
.compose textarea:focus{border-color:var(--acc);outline:none}
.sbtn{font:inherit;font-size:15px;padding:9px 12px;border:2px solid #11131d;background:#3a3e58;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 #11131d}
.preview{display:flex;flex-wrap:wrap;gap:6px;font-size:13px}
.preview span{padding:2px 8px;border:2px solid rgba(255,255,255,.18);color:var(--muted)}
.preview b{color:var(--ink);font-weight:400}
.note{font-size:12px;color:var(--muted);margin-top:-6px}
.redo{font:inherit;font-size:14px;margin-top:6px;background:none;border:2px solid rgba(255,255,255,.18);color:var(--ink);padding:6px 10px;cursor:pointer;width:100%;text-align:left}
.redo:hover{border-color:var(--acc)}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.nextup{position:fixed;z-index:2;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(840px,calc(100vw - 32px));max-height:48vh;overflow-y:auto;box-sizing:border-box;display:none;flex-direction:column;gap:10px;padding:12px 14px 14px;background:rgba(27,29,43,.66);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:2px solid rgba(255,255,255,.18);box-shadow:0 4px 0 rgba(17,19,29,.6);font-family:'Pixelify Sans',system-ui,sans-serif;color:var(--ink)}
.nextup.show{display:flex}
.nuhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
#nuh{font-size:20px;font-weight:600}
.nusub{font-size:14px;color:var(--muted)}
.nucards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.nucard{background:rgba(38,42,61,.92);border:2px solid #3a3e58;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.nurm{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nunew{color:var(--acc)}
.nut{font-size:16px;line-height:1.3}
.nutags{display:flex;gap:6px;flex-wrap:wrap}
.nutags span{font-size:12px;padding:1px 6px;border:2px solid #5d6288;color:#e2dacd}
.nubtns{display:flex;gap:12px;margin-top:auto;padding-top:4px;align-items:center}
.nudone{font:inherit;font-size:15px;padding:6px 16px;border:2px solid #11131d;background:var(--acc);color:#3a2a10;cursor:pointer;box-shadow:0 3px 0 #a07a2a}
.nudone:active{transform:translateY(2px);box-shadow:0 1px 0 #a07a2a}
.nulater{font:inherit;font-size:13px;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px 0}
.nudone:focus-visible,.nulater:focus-visible{outline:2px solid #fff;outline-offset:2px}
.nuempty{color:var(--muted);font-size:15px;padding:4px 2px}
@media (max-width:640px){.nucards{grid-template-columns:1fr}}
.toast{position:fixed;z-index:7;left:50%;top:max(16px,env(safe-area-inset-top,0px));transform:translate(-50%,-16px);opacity:0;transition:opacity .25s,transform .25s;background:var(--acc);color:#3a2a10;font-family:'Pixelify Sans',system-ui,sans-serif;font-size:18px;padding:10px 18px;border:2px solid #11131d;box-shadow:0 4px 0 #a07a2a;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.more{list-style:none}
.scard .tmore{font-size:13px;color:var(--muted);padding-left:18px}
.pane{position:fixed;z-index:2;width:280px;max-width:calc(100vw - 32px);background:rgba(27,29,43,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:2px solid rgba(255,255,255,.18);box-shadow:0 4px 0 rgba(17,19,29,.6);padding:12px 14px 14px;color:var(--ink);display:none}
.pane.show{display:block;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pane h2{font-size:18px;font-weight:600;margin:0;display:flex;align-items:center;gap:8px}
.pane .tag{font-size:12px;font-weight:400;padding:1px 6px;border:2px solid rgba(255,255,255,.2);color:var(--muted)}
.pane .tag.lit{color:#3a2a10;background:var(--acc);border-color:var(--acc)}
.pane .x{position:absolute;top:8px;right:8px;font:inherit;font-size:16px;line-height:1;background:none;border:0;color:var(--muted);cursor:pointer;padding:4px}
.pane p{margin:4px 0 10px;font-size:13px;color:var(--muted)}
.pane ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pane li{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.3}
.stage canvas{width:100vw;height:100vh;max-width:none;image-rendering:pixelated;display:block}
h1{font-size:22px;font-weight:600;margin:0;letter-spacing:.5px}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font:inherit;font-size:15px;color:var(--ink);background:var(--panel);border:2px solid var(--line);padding:6px 12px 6px 10px;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 3px 0 #11131d}
.tab:active{transform:translateY(2px);box-shadow:0 1px 0 #11131d}
.tab.on{border-color:var(--acc);background:#2e3049}
.dot{width:8px;height:8px;background:#5a5f80;box-shadow:0 0 0 2px #11131d}
.dot.lit{background:var(--acc);box-shadow:0 0 0 2px #11131d,0 0 8px #ffcf6b}
.stage{background:#161826;border:2px solid var(--line);display:flex;justify-content:center}
canvas{image-rendering:pixelated;width:100%;max-width:880px;height:auto;display:block}
.hud{display:flex;flex-wrap:wrap;gap:14px;align-items:center;background:var(--panel);border:2px solid var(--line);padding:12px 14px}
.info{flex:1;min-width:220px}
.rn{font-size:19px;font-weight:600}
.st{color:var(--muted);font-size:14px;margin-top:2px}
.bar{display:flex;gap:4px;margin-top:8px}
.pip{width:22px;height:10px;background:#3a3e58}
.pip.f{background:var(--acc)}
.btn{font:inherit;font-size:15px;padding:9px 14px;border:2px solid #11131d;background:var(--acc);color:var(--acc-ink);cursor:pointer;box-shadow:0 4px 0 #a07a2a}
.btn.alt{background:#3a3e58;color:var(--ink);box-shadow:0 4px 0 #11131d}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a07a2a}
.btn.alt:active{box-shadow:0 1px 0 #11131d}
@media (max-width:520px){.btn{flex:1}}
</style>
</head>
<body>
<div class="stage"><canvas id="c"></canvas></div>
<button class="menu-btn" id="mb" aria-label="Open menu" aria-expanded="false" aria-controls="drawer"><span></span><span></span><span></span></button>
<div class="chest-wrap" id="cw" role="dialog" aria-modal="true" aria-labelledby="ctitle"><div class="chest-card"><div class="ct" id="ctitle">You found a chest</div><div class="cs" id="csub"></div><canvas id="chc" width="48" height="40"></canvas><div class="cres" id="cres" aria-live="polite"></div><button class="cbtn" id="cbtn">Open it</button></div></div>
<aside class="drawer" id="drawer" aria-label="Menu">
  <div class="dh"><h2>Menu</h2><button class="x" id="dx" aria-label="Close menu">x</button></div>
  <section><h3>To-dos</h3><div id="todos"></div></section>
  <section><h3>Your house</h3><button class="redo" id="redo">Redo setup</button></section>
</aside>
<div class="ob" id="ob" role="dialog" aria-modal="true" aria-labelledby="obt">
  <div class="obc" id="ivs">
    <div class="ivtop"><span class="ivn" id="ivn">Let's build your house</span><button class="oblink" id="obskip">Skip, show me the demo house</button></div>
    <div class="obhead"><div><p class="ivack" id="ivack" aria-live="polite"></p><h2 id="obt"></h2>

function pixelCapy(){

  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const body=inE(x,y,21,14.5,12.5,8.5),head=inE(x,y,10.5,12.5,8.5,6.5),snout=inE(x,y,6,13,5,4.6);
    const nearLeg=y>=19&&y<=25&&((x>=11&&x<=14)||(x>=26&&x<=30)),farLeg=y>=19&&y<=24&&((x>=16&&x<=18)||(x>=22&&x<=24));
    let c=null;

    if(inE(x,y,14.5,6.2,1.7,1.7)||inE(x,y,17.6,6.8,2,2))c='E';
    if(body||head||snout)c=(x<=7&&(head||snout))?'M':(y>=20?'D':'B');

  S[7][17]='M';S[7][18]='M';
  for(let y=0;y<9;y++)for(let x=6;x<17;x++){const d=Math.hypot(x+.5-11.5,y+.5-4.2);if(d<=3.1)S[y][x]=d>2.2?'K':(x>12&&y>4?'Q':'O')}

  const out=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(S[y][x]===null&&(solid(x-1,y)||solid(x+1,y)||solid(x,y-1)||solid(x,y+1)))out.push([x,y]);

  S[10][12]='K';S[10][13]='W';S[11][12]='K';S[11][13]='K';

      let prev;do{prev=part;part=part.replace(/^(?:and|also|then|plus)\s+/i,'').replace(/^(?:i\s+)?(?:really\s+)?(?:need|have|want|should|must|gotta|ought)\s+to\s+/i,'').replace(/^i\s+keep\s+(?:forgetting|putting\s+off)\s+(?:to\s+)?/i,'').trim()}while(part!==prev);

  plan=fallbackPlan();showSummary();
}
function uniq(list){const seen={};return list.map(r=>{let n=String(r.name||'Room').trim().slice(0,24)||'Room';const base=n;let k=2;while(seen[n.toLowerCase()])n=base+' '+k++;seen[n.toLowerCase()]=1;return Object.assign({},r,{name:n})})}
let picked=[];
function showSummary(){
  plan.rooms=uniq(plan.rooms.slice(0,9));picked=plan.rooms.map(()=>true);
  document.getElementById('sumlead').textContent=(plan.message?plan.message+' ':'')+'Tap an area to keep it or leave it out. Your house starts with one small room and grows from there.';
  const gl=plan.goals||[];
  document.getElementById('goals').innerHTML=gl.length?`<span class="gl">Your big goals</span>`+gl.map(g=>`<span class="g">${esc(String(g))}</span>`).join(''):'';
  const grid=document.getElementById('sumgrid');
  grid.innerHTML=plan.rooms.map((r,i)=>`<button class="scard" type="button" aria-pressed="true" data-i="${i}"><span class="top"><span class="nm">${esc(r.name)}</span><span class="tick" aria-hidden="true">✓</span></span><span class="why">${esc(r.why||KIND_LABEL[r.template]||'Room')}</span><span class="tds">${(r.todos||[]).slice(0,2).map(t=>`<span class="td">${esc(String(t&&t.text!==undefined?t.text:t))}</span>`).join('')}</span>${(r.todos||[]).length>2?`<span class="tmore">+${r.todos.length-2} more to-dos</span>`:''}</button>`).join('');
  grid.querySelectorAll('.scard').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;picked[i]=!picked[i];b.setAttribute('aria-pressed',picked[i]);oberr2()});
  oberr2();ivs.style.display='none';sums.style.display='flex';document.getElementById('obgo').focus();
}
function oberr2(){const n=picked.filter(Boolean).length,b=document.getElementById('obgo');b.textContent=n?`Start my house (${n} ${n===1?'area':'areas'})`:'Pick at least one area';b.disabled=!n}
function buildFromPlan(){
  const keep=plan.rooms.filter((r,i)=>picked[i]);if(!keep.length)return false;
  for(const k in TODO)delete TODO[k];
  AREAS_ST=keep.map((r,k)=>({name:r.name,tpl:(TPL[r.template]&&r.template!=='spare')?r.template:'desk',why:r.why||'',built:k===0,bi:k===0?0:-1,w:.6,dw:.6,lv:k===0?2:1}));
  keep.forEach(r=>TODO[r.name]=(r.todos||[]).slice(0,8).map((t,i)=>mkTodo(t,i)));
  resetProgress();rebuildHouse();fillInitial();return true;
}
function startDemo(){
  AREAS_ST=DEMO_LIST.map((d,k)=>({name:d.name,tpl:d.tpl,why:'',built:true,bi:k,w:d.w,dw:d.w,lv:d.lv}));
  for(const k in TODO)delete TODO[k];for(const n in DEMO_TODOS)TODO[n]=DEMO_TODOS[n].map((t,i)=>mkTodo(t,i));
  resetProgress();rebuildHouse();fillInitial();
}
function bringIn(){const now=performance.now();let d=350;rooms.forEach(r=>r.items.forEach(it=>{if(it.own){it.t0=now+d;it.landed=0;d+=150}}))}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition,micBtn=document.getElementById('mic');let rec=null,micOn=false,micBase='';
if(!SR)micBtn.style.display='none';
const ivstat=document.getElementById('ivstat');let heard=false;
function stopMic(){if(rec&&micOn){micOn=false;try{rec.stop()}catch(_){}}micBtn.setAttribute('aria-pressed','false');document.getElementById('miclbl').textContent='Talk';if(!busy)ivstat.textContent=''}
const MIC_ERR={
  'not-allowed':'Your browser blocked the microphone. Click the lock icon next to the address, allow the microphone, then try again.',
  'service-not-allowed':'This browser doesn\'t allow speech-to-text here. Try Chrome or Edge, or dictate with Wispr Flow.',
  'audio-capture':'No microphone was found. Check that one is connected and not used by another app.',
  'network':'Speech-to-text needs an internet connection to Google\'s service, and it didn\'t respond. Try Chrome, or dictate with Wispr Flow.',
  'language-not-supported':'Speech-to-text doesn\'t support your browser\'s language here. Try Chrome, or dictate with Wispr Flow.'};
micBtn.onclick=()=>{
  if(micOn){stopMic();return}
  oberr.textContent='';heard=false;
  rec=new SR();rec.lang='en-US';rec.continuous=true;rec.interimResults=true;
  micBase=ivta.value?ivta.value.replace(/\s*$/,' '):'';
  rec.onstart=()=>{ivstat.textContent='Listening... speak now'};
  rec.onresult=e=>{heard=true;ivstat.textContent='Listening...';let fin='',mid='';for(let i=0;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=t;else mid+=t}ivta.value=micBase+fin+mid};
  rec.onerror=e=>{if(e.error==='no-speech'||e.error==='aborted')return;oberr.textContent=MIC_ERR[e.error]||`The microphone stopped (${e.error}). Try again, or type instead.`;stopMic()};
  rec.onend=()=>{if(micOn){micBase=ivta.value?ivta.value.replace(/\s*$/,' '):'';try{rec.start()}catch(_){stopMic()}}};
  try{rec.start();micOn=true;micBtn.setAttribute('aria-pressed','true');document.getElementById('miclbl').textContent='Stop';ivstat.textContent='Starting the microphone...'}
  catch(_){oberr.textContent='Could not start the microphone. Type instead, or dictate with Wispr Flow.'}
};
function openSetup(){
  hist=[];plan=null;asked=0;seenOrder=[];oberr.textContent='';setBusy(false);stopMic();
  sums.style.display='none';ivs.style.display='flex';ob.classList.add('show');closeDrawer();closePane();
  showQ(FIRST_Q,FIRST_HINT,1,'');renderNext();
}
ivnext.onclick=()=>next(false);
document.getElementById('ivskip').onclick=()=>next(true);
ivta.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();next()}});
document.getElementById('sumback').onclick=()=>{const q='What else should your house know?';hist.push({role:'assistant',content:q});sums.style.display='none';ivs.style.display='flex';showQ(q,'A room I missed, a to-do to add, or something to change. Like: "Add a room for my dog."',5,'')};
document.getElementById('restart').onclick=openSetup;
document.getElementById('obgo').onclick=()=>{if(!buildFromPlan())return;ob.classList.remove('show');bringIn();renderNext()};
document.getElementById('obskip').onclick=()=>{stopMic();startDemo();ob.classList.remove('show');bringIn();renderNext()};
document.getElementById('redo').onclick=openSetup;
startDemo();
openSetup();
requestAnimationFrame(loop);
</script>
</body>
</html>
