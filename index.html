<title>Life House</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--grass:#74ad58;--ink:#f3eadc;--muted:#a9a5c6;--acc:#ffcf6b;--panel:rgba(27,29,43,.82)}
html,body{margin:0;height:100%}
body{background:var(--grass);background-image:linear-gradient(45deg,rgba(0,0,0,.04) 25%,transparent 25%,transparent 75%,rgba(0,0,0,.04) 75%),linear-gradient(45deg,rgba(0,0,0,.04) 25%,transparent 25%,transparent 75%,rgba(0,0,0,.04) 75%);background-size:12px 12px;background-position:0 0,6px 6px;font-family:'Pixelify Sans',system-ui,sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
form{background:var(--panel);border:2px solid #11131d;box-shadow:0 5px 0 rgba(17,19,29,.5);padding:20px;width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px}
h1{margin:0;font-size:22px;font-weight:600}
p{margin:0;color:var(--muted);font-size:14px}
input{font:inherit;font-size:16px;padding:9px 10px;border:2px solid #3a3e58;background:#1b1d2b;color:var(--ink);outline:none}
input:focus{border-color:var(--acc)}
button{font:inherit;font-size:16px;padding:9px;border:2px solid #11131d;background:var(--acc);color:#3a2a10;cursor:pointer;box-shadow:0 4px 0 #a07a2a}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #a07a2a}
.err{color:#ff9f8f;font-size:13px;min-height:16px}
</style></head><body>
<form id="f"><h1>Life house</h1><p>This house is private. Enter the password you were given.</p>

<button type="submit">Open the door</button><div class="err" id="err" role="alert"></div></form>

async function open_(pw){
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(S),iterations:N,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(I)},k,u(C));
  return new TextDecoder().decode(pt);
}
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();const pw=document.getElementById('pw').value,err=document.getElementById('err');
  if(!pw){err.textContent='Enter the password first.';return}
  err.textContent='Opening...';
  try{const html=await open_(pw);try{sessionStorage.setItem('lh',pw)}catch(_){}document.open();document.write(html);document.close()}
  catch(_){err.textContent='That password is not right. Check it and try again.'}
});
